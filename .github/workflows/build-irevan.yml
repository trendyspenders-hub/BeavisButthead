name: Build I.R.Evan macOS test installer
on:
  workflow_dispatch:
  push:
    branches: [main, circuit-preamp-work]
permissions:
  contents: read
jobs:
  circuit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install circuit reference simulator
        run: sudo apt-get update -qq && sudo apt-get install -y ngspice
      - name: Circuit stress and reference tests
        run: |
          mkdir -p circuit-results
          c++ -std=c++17 -O3 -Wall -Wextra -Werror tests/circuit_dsp.cpp -o /tmp/circuit-test
          /tmp/circuit-test | tee circuit-results/stress.txt
          python3 tests/circuit_spice.py > circuit-results/spice.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-results
          path: circuit-results/
  mac:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify factory catalog
        run: |
          c++ -std=c++17 tests/factory_library.cpp -o /tmp/factory-test
          /tmp/factory-test models
      - name: Build universal AU and VST3, PKG and DMG
        run: bash scripts/build-mac.command
      - name: Install test package and validate Audio Unit
        run: |
          TASK_PKG=$(find "$GITHUB_WORKSPACE" -path '*/disk/*.pkg' -type f -print -quit)
          test -n "$TASK_PKG"
          sudo installer -pkg "$TASK_PKG" -target /
          bash scripts/validate-mac-installed.command
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-logs
          path: |
            mac-build-*/*.log
            mac-validation-*/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Beavis-And-Butthead-by-IR-Evan-macOS-unsigned
          path: |
            mac-build-*/*.dmg
            mac-build-*/disk/*.pkg
          if-no-files-found: error
